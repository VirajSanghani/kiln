# Alembic config for KILN.
# script_location is resolved relative to this file (%(here)s) so it works regardless
# of the working directory the api container runs from.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Default URL is the SQLite local-dev fallback; env.py overrides with DATABASE_URL
# when it is set (compose always sets it to Postgres).
sqlalchemy.url = sqlite:///./kiln_dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
